<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>❤️ My soulmate ❤️</title>

<style>
body{
    margin:0;
    font-family:Arial;
    text-align:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    overflow-x:hidden;
}

/* 🌙 الوضع الليلي */
body.night{
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
}

body.night header{
    background:rgba(0,0,0,0.5);
}

body.night .box,
body.night .memory{
    background:#111;
    color:white;
}

body.night button{
    background:#444;
}

/* ❤️ القلوب / النجوم */
.hearts{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:0;
}

.heart{
    position:absolute;
    animation:float 8s linear infinite;
}

@keyframes float{
    0%{transform:translateY(110vh);opacity:0;}
    10%{opacity:1;}
    100%{transform:translateY(-10vh);opacity:0;}
}

/* 🔐 صفحة الباسورد */
#login{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:1;
    position:relative;
}

.box{
    background:white;
    padding:40px;
    border-radius:20px;
    width:90%;
    max-width:350px;
    box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

input{
    width:90%;
    padding:12px;
    font-size:18px;
    margin:15px 0;
    border-radius:10px;
    border:1px solid #ccc;
    text-align:center;
}

button{
    background:#ff9a9e;
    color:white;
    border:none;
    padding:12px 25px;
    font-size:18px;
    border-radius:25px;
    cursor:pointer;
}

#error{
    color:red;
    display:none;
}

/* ❤️ الموقع */
#site{
    display:none;
    position:relative;
    z-index:1;
}

header{
    padding:40px;
    background:rgba(255,255,255,0.8);
}

.show-btn{
    background:white;
    color:black;
    padding:15px 25px;
    border:none;
    border-radius:30px;
    font-size:18px;
    margin:25px auto;
    cursor:pointer;
}

/* الصور */
#photos{display:none;padding:30px;}
img{
    width:90%;
    max-width:300px;
    margin:15px auto;
    display:block;
    border-radius:15px;
    box-shadow:0 5px 10px rgba(0,0,0,0.5);
}

/* الذكريات */
.memories{padding:30px;}
.memory{
    background:white;
    margin:15px auto;
    padding:15px;
    border-radius:15px;
    max-width:500px;
}
</style>
</head>

<body>

<div class="hearts" id="hearts"></div>

<div id="login">
    <div class="box">
        <h2>🔐 دخول خاص</h2>
        <input type="password" id="password" placeholder="الباسورد">
        <br>
        <button onclick="check()">دخول</button>
        <div id="error">الباسورد غلط 😢</div>
    </div>
</div>

<div id="site">

<audio id="music" loop>
    <source src="love.mp3" type="audio/mpeg">
</audio>

<header>
    <h1>❤️ My soulmate ❤️</h1>
    <p>خيبتي</p>

    <div id="timer">
        <strong id="timePassed"></strong>
    </div>

    <p id="loveMessage"></p>
</header>

<button class="show-btn" onclick="showPhotos()">💖 صورنا 💖</button>

<section id="photos">
    <img src="image1.jpg">
    <img src="image2.jpg">
</section>

<section class="memories">
    <div class="memory">أول مرة شفتك حسيت إن الدنيا اختلفت ❤️</div>
</section>

</div>

<script>
// 🔐 تسجيل الدخول
function check(){
    if(document.getElementById("password").value === "love karen"){
        login.style.display="none";
        site.style.display="block";
        music.volume=0.4;
        music.play();
        typeMessage();
    }else{
        error.style.display="block";
    }
}

// 🌙 الوضع الليلي
function nightMode(){
    const h=new Date().getHours();
    document.body.classList.toggle("night",h>=20||h<6);
}
nightMode();
setInterval(nightMode,60000);

// ⏳ عداد الحب
const startDate=new Date("2025-07-23T17:00:00");
function updateTimer(){
    const now=new Date();
    if(now<startDate){
        timePassed.innerHTML="⏳ مستنيين البداية ❤️";
        return;
    }
    let d=now-startDate;
    timePassed.innerHTML=
    `${Math.floor(d/86400000)} يوم ❤️ 
     ${Math.floor(d/3600000)%24} ساعة 
     ${Math.floor(d/60000)%60} دقيقة 
     ${Math.floor(d/1000)%60} ثانية`;
}
updateTimer();
setInterval(updateTimer,1000);

// 💌 رسالة حرف حرف
const msg="من يوم ما عرفتك، وأنا متأكد إن أحلى حاجة حصلتلي هي إنتِ ❤️";
let i=0;
function typeMessage(){
    if(i<msg.length){
        loveMessage.innerHTML+=msg.charAt(i++);
        setTimeout(typeMessage,80);
    }
}

// ❤️ قلوب / ✨ نجوم
function createHeart(){
    const el=document.createElement("div");
    el.className="heart";
    if(document.body.classList.contains("night")){
        el.innerHTML=["✨","⭐","🌟"][Math.floor(Math.random()*3)];
    }else{
        el.innerHTML="❤️";
    }
    el.style.left=Math.random()*100+"vw";
    el.style.fontSize=14+Math.random()*22+"px";
    el.style.animationDuration=6+Math.random()*4+"s";
    hearts.appendChild(el);
    setTimeout(()=>el.remove(),10000);
}
setInterval(createHeart,500);

// الصور
function showPhotos(){
    photos.style.display="block";
}
</script>

</body>
</html>
