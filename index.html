<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>❤️ My soulmate ❤️</title>

<style>
body{
    margin:0;
    font-family:Arial;
    text-align:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    overflow-x:hidden;
}

/* ❤️ قلوب متحركة */
.hearts{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:hidden;
    z-index:0;
}

.heart{
    position:absolute;
    color:rgba(255,255,255,0.75);
    animation:float 8s linear infinite;
}

@keyframes float{
    0%{
        transform:translateY(110vh) scale(1);
        opacity:0;
    }
    10%{opacity:1;}
    100%{
        transform:translateY(-10vh) scale(1.6);
        opacity:0;
    }
}

/* 🔐 صفحة الباسورد */
#login{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    z-index:1;
}

.box{
    background:white;
    color:black;
    padding:40px;
    border-radius:20px;
    width:90%;
    max-width:350px;
    box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

input{
    width:90%;
    padding:12px;
    font-size:18px;
    margin:15px 0;
    border-radius:10px;
    border:1px solid #ccc;
    text-align:center;
}

button{
    background:#ff9a9e;
    color:white;
    border:none;
    padding:12px 25px;
    font-size:18px;
    border-radius:25px;
    cursor:pointer;
}

#error{
    color:red;
    display:none;
}

/* ❤️ الموقع */
#site{
    display:none;
    position:relative;
    z-index:1;
}

header{
    padding:40px;
    background:rgba(255,255,255,0.8);
}

/* زر الصور */
.show-btn{
    background:white;
    color:black;
    padding:15px 25px;
    border:none;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    margin:25px auto;
    box-shadow:0 5px 10px rgba(0,0,0,0.4);
}

/* الصور */
#photos{
    display:none;
    padding:30px;
}

img{
    width:90%;
    max-width:300px;
    display:block;
    margin:15px auto;
    border-radius:15px;
    box-shadow:0 5px 10px rgba(0,0,0,0.5);
}

/* 💌 الذكريات */
.memories{
    padding:30px;
}

.memory{
    background:white;
    color:black;
    margin:15px auto;
    padding:15px;
    border-radius:15px;
    max-width:500px;
    box-shadow:0 5px 10px rgba(0,0,0,0.3);
}
</style>
</head>

<body>

<!-- ❤️ القلوب -->
<div class="hearts" id="hearts"></div>

<!-- 🔐 صفحة الباسورد -->
<div id="login">
    <div class="box">
        <h2>🔐 دخول خاص</h2>
        <p>اكتبي الباسورد ❤️</p>
        <input type="password" id="password" placeholder="الباسورد">
        <br>
        <button onclick="check()">دخول</button>
        <div id="error">الباسورد غلط 😢</div>
    </div>
</div>

<!-- ❤️ الموقع -->
<div id="site">

<audio id="music" loop preload="auto">
    <source src="love.mp3" type="audio/mpeg">
</audio>

<header>
    <h1>❤️ My soulmate ❤️</h1>
    <p>خيبتي</p>

    <!-- ⏳ عداد الحب -->
    <div id="timer" style="font-size:20px; margin-top:15px;">
        <strong id="timePassed"></strong>
    </div>
</header>

<button class="show-btn" onclick="showPhotos()">
    💖 دوسي هنا علشان تشوفي صورنا 💖
</button>

<section id="photos">
    <h2>صورنا 📸</h2>
    <img src="image1.jpg">
    <img src="image2.jpg">
    <img src="image3.jpg">
    <img src="image4.jpg">
    <img src="image5.jpg">
    <img src="image6.jpg">
    <img src="image7.jpg">
    <img src="image8.jpg">
    <img src="image9.jpg">
    <img src="image10.jpg">
    <img src="image11.jpg">
    <img src="image12.jpg">
    <img src="image13.jpg">
    <img src="image14.jpg">
    <img src="image15.jpg">
</section>

<section class="memories">
    <h2>ذكرياتنا 💌</h2>
    <div class="memory">أول مرة شفتك فيها حسيت اننا مهنجين 😂❤️</div>
    <div class="memory">فاكره لما كنا في بروفة المسرح قولتلك ايه؟ 🥸</div>
    <div class="memory">دي مش ذكرى… بس متزعليش على أي حاجة 💕</div>
</section>

</div>

<script>
function check(){
    const pass = document.getElementById("password").value;
    const correct = "1912";

    if(pass === correct){
        document.getElementById("login").style.display="none";
        document.getElementById("site").style.display="block";
        const music = document.getElementById("music");
        music.volume = 0.4;
        music.play();
    }else{
        document.getElementById("error").style.display="block";
    }
}

function showPhotos(){
    const photos = document.getElementById("photos");
    photos.style.display="block";
    photos.scrollIntoView({behavior:"smooth"});
}

/* ⏳ عداد الحب التصاعدي */
const startDate = new Date("2025-07-23T17:00:00");

function updateTimer(){
    const now = new Date();

    if(now < startDate){
        document.getElementById("timePassed").innerHTML =
            "⏳ مستنيين اللحظة اللي الحكاية تبدأ فيها ❤️";
        return;
    }

    let diff = now - startDate;
    const seconds = Math.floor(diff / 1000);
    const minutes = Math.floor(seconds / 60);
    const hours   = Math.floor(minutes / 60);
    const days    = Math.floor(hours / 24);

    document.getElementById("timePassed").innerHTML =
        `من يوم 23/7/2025 وإحنا مع بعض ❤️<br>
         ${days} يوم 💞 ${hours % 24} ساعة ⏰ ${minutes % 60} دقيقة ⏳ ${seconds % 60} ثانية`;
}

updateTimer();
setInterval(updateTimer, 1000);

/* ❤️ توليد القلوب */
function createHeart(){
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (14 + Math.random() * 22) + "px";
    heart.style.animationDuration = (6 + Math.random() * 4) + "s";
    document.getElementById("hearts").appendChild(heart);
    setTimeout(() => heart.remove(), 10000);
}
setInterval(createHeart, 500);
</script>

</body>
</html>
