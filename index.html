<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>حكايتنا ❤️</title>

<style>
body{
    margin:0;
    font-family:Arial;
    text-align:center;
    color:white;
}

/* 🎥 فيديو الخلفية */
.video-bg{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-2;
    overflow:hidden;
}

.video-bg video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* طبقة غامقة فوق الفيديو */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.45);
    z-index:-1;
}

/* 🔐 صفحة الباسورد */
#login{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.box{
    background:rgba(255,255,255,0.95);
    color:black;
    padding:40px;
    border-radius:20px;
    width:90%;
    max-width:350px;
    box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

input{
    width:90%;
    padding:12px;
    font-size:18px;
    margin:15px 0;
    border-radius:10px;
    border:1px solid #ccc;
    text-align:center;
}

button{
    background:#ff9a9e;
    color:white;
    border:none;
    padding:12px 25px;
    font-size:18px;
    border-radius:25px;
    cursor:pointer;
}

#error{
    color:red;
    display:none;
}

/* ❤️ الموقع */
#site{
    display:none;
}

header{
    padding:40px;
    background:rgba(255,255,255,0.15);
}

/* زر الصور */
.show-btn{
    background:white;
    color:black;
    padding:15px 25px;
    border:none;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    margin:25px auto;
    box-shadow:0 5px 10px rgba(0,0,0,0.4);
}

/* الصور */
#photos{
    display:none;
    padding:30px;
}

img{
    width:90%;
    max-width:300px;
    display:block;
    margin:15px auto;
    border-radius:15px;
    box-shadow:0 5px 10px rgba(0,0,0,0.5);
}

/* 💌 الذكريات */
.memories{
    padding:30px;
}

.memory{
    background:rgba(255,255,255,0.9);
    color:black;
    margin:15px auto;
    padding:15px;
    border-radius:15px;
    max-width:500px;
    box-shadow:0 5px 10px rgba(0,0,0,0.3);
}
</style>
</head>

<body>

<!-- 🎥 فيديو الخلفية -->
<div class="video-bg">
    <video autoplay muted loop playsinline>
        <source src="bg.mp4" type="video/mp4">
    </video>
</div>
<div class="overlay"></div>

<!-- 🔐 صفحة الباسورد -->
<div id="login">
    <div class="box">
        <h2>🔐 دخول خاص</h2>
        <p>اكتبي الباسورد ❤️</p>
        <input type="password" id="password" placeholder="الباسورد">
        <br>
        <button onclick="check()">دخول</button>
        <div id="error">الباسورد غلط 😢</div>
    </div>
</div>

<!-- ❤️ الموقع -->
<div id="site">

<audio id="music" loop>
    <source src="love.mp3" type="audio/mpeg">
</audio>

<header>
    <h1>❤️ My soulmate ❤️</h1>
    <p>خيبتي</p>
</header>

<button class="show-btn" onclick="showPhotos()">
    💖 دوسي هنا علشان تشوفي صورنا 💖
</button>

<section id="photos">
    <h2>صورنا 📸</h2>

    <img src="image1.jpg">
    <img src="image2.jpg">
    <img src="image3.jpg">
    <img src="image4.jpg">
    <img src="image5.jpg">
    <img src="image6.jpg">
    <img src="image7.jpg">
    <img src="image8.jpg">
    <img src="image9.jpg">
    <img src="image10.jpg">
    <img src="image11.jpg">
    <img src="image12.jpg">
    <img src="image13.jpg">
    <img src="image14.jpg">
    <img src="image15.jpg">
</section>

<section class="memories">
    <h2>ذكرياتنا 💌</h2>

    <div class="memory">
        أول مرة شفتك فيها حسيت اننا مهنجين 😂❤️
    </div>

    <div class="memory">
        فكره لما كنا في بروفه المسرح قولتلك ايه؟ 🥸
    </div>

    <div class="memory">
        دي مش ذكري بس متزعليش علي اي حاجه مفيش حاجه تستاهل زعلك 💕
    </div>
</section>

</div>

<script>
function check(){
    const pass = document.getElementById("password").value;
    const correct = "love karen"; // ✏️ غير الباسورد هنا

    if(pass === correct){
        document.getElementById("login").style.display="none";
        document.getElementById("site").style.display="block";

        const music = document.getElementById("music");
        music.volume = 0.4;
        music.play();
    }else{
        document.getElementById("error").style.display="block";
    }
}

function showPhotos(){
    const photos = document.getElementById("photos");
    photos.style.display="block";
    photos.scrollIntoView({behavior:"smooth"});
}
</script>

</body>
</html>
