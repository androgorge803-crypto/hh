<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>حكايتنا ❤️</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    text-align:center;
}

header{
    padding:40px;
    background:rgba(255,255,255,0.8);
}

section{
    padding:30px;
}

img{
    width:90%;
    max-width:300px;
    display:block;
    margin:15px auto;
    border-radius:15px;
    box-shadow:0 5px 10px rgba(0,0,0,0.3);
}

.memory{
    background:white;
    margin:15px;
    padding:15px;
    border-radius:15px;
}

/* زرار عرض الصور */
.show-btn{
    background:white;
    padding:15px 25px;
    border:none;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    margin:25px auto;
    box-shadow:0 5px 10px rgba(0,0,0,0.3);
}

/* الصور مخفية */
#photos{
    display:none;
}
</style>
</head>

<body>

<!-- 🎶 الموسيقى -->
<audio id="bg-music" loop>
    <source src="love.mp3" type="audio/mpeg">
</audio>

<script>
window.addEventListener("load", () => {
    const music = document.getElementById("bg-music");
    music.volume = 0.4;
    music.play().catch(() => {
        document.body.addEventListener("click", () => {
            music.play();
        }, { once: true });
    });
});

function showPhotos(){
    const photos = document.getElementById("photos");
    photos.style.display = "block";
    photos.scrollIntoView({ behavior: "smooth" });
}
</script>

<header>
    <h1>❤️ My soulmate ❤️</h1>
    <p>خيبتي</p>
</header>

<button class="show-btn" onclick="showPhotos()">
    💖 دوسي هنا علشان تشوفي صورنا 💖
</button>

<section id="photos">
    <h2>صورنا 📸</h2>

    <img src="image1.jpg">
    <img src="image2.jpg">
    <img src="image3.jpg">
    <img src="image4.jpg">
    <img src="image5.jpg">
    <img src="image6.jpg">
    <img src="image7.jpg">
    <img src="image8.jpg">
    <img src="image9.jpg">
    <img src="image10.jpg">
    <img src="image11.jpg">
    <img src="image12.jpg">
    <img src="image13.jpg">
    <img src="image14.jpg">
    <img src="image15.jpg">
</section>

<section>
    <h2>ذكرياتنا 💌</h2>

    <div class="memory">
        أول مرة شفتك فيها حسيت إن الدنيا وقفت ❤️
    </div>

    <div class="memory">
        وأي يوم معاكي هو أحلى يوم في حياتي 🌹
    </div>
</section>

</body>
</html>
