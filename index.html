<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>دخول خاص ❤️</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    text-align:center;
}

/* صندوق الباسورد */
#login{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 20px rgba(0,0,0,0.3);
    width:90%;
    max-width:350px;
}

input{
    width:90%;
    padding:12px;
    font-size:18px;
    margin:15px 0;
    border-radius:10px;
    border:1px solid #ccc;
    text-align:center;
}

button{
    background:#ff9a9e;
    color:white;
    border:none;
    padding:12px 25px;
    font-size:18px;
    border-radius:25px;
    cursor:pointer;
}

#error{
    color:red;
    display:none;
}

/* الموقع مخفي في الأول */
#site{
    display:none;
}

header{
    padding:40px;
    background:rgba(255,255,255,0.8);
}

img{
    width:90%;
    max-width:300px;
    display:block;
    margin:15px auto;
    border-radius:15px;
    box-shadow:0 5px 10px rgba(0,0,0,0.3);
}
</style>
</head>

<body>

<!-- 🔐 صفحة الباسورد -->
<div id="login">
    <div class="box">
        <h2>🔐 دخول خاص</h2>
        <p>اكتبي الباسورد ❤️</p>
        <input type="password" id="password" placeholder="الباسورد">
        <br>
        <button onclick="check()">دخول</button>
        <div id="error">غلط خليكي كده</div>
    </div>
</div>

<!-- ❤️ الموقع -->
<div id="site">

<audio id="music" loop>
    <source src="love.mp3" type="audio/mpeg">
</audio>

<header>
    <h1>❤️ My soulmate ❤️</h1>
    <p>خيبتي</p>
</header>

<section>
    <h2>صورنا 📸</h2>

    <img src="image1.jpg">
    <img src="image2.jpg">
    <img src="image3.jpg">
    <img src="image4.jpg">
    <img src="image5.jpg">
    <img src="image6.jpg">
    <img src="image7.jpg">
    <img src="image8.jpg">
    <img src="image9.jpg">
    <img src="image10.jpg">
    <img src="image11.jpg">
    <img src="image12.jpg">
    <img src="image13.jpg">
    <img src="image14.jpg">
    <img src="image15.jpg">
</section>

</div>

<script>
function check(){
    const pass = document.getElementById("password").value;
    const correct = "love karen"; // غير الباسورد هنا

    if(pass === correct){
        document.getElementById("login").style.display="none";
        document.getElementById("site").style.display="block";

        const music = document.getElementById("music");
        music.volume = 0.4;
        music.play();
    }else{
        document.getElementById("error").style.display="block";
    }
}
</script>

</body>
</html>
